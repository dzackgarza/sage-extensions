#name: Coble kernel incidence rows (#381)
## The Tits-building incidence of the two kernel rows of #381: the edges
## between the Otilde(T_Co)-orbits and the Otilde+(T_Co)-orbits of primitive
## isotropic lines and planes of T_Co, through the public incidence call the
## `route` input names: `divided-class`, which decides each edge from the
## divided class of the carried line, `certificate`, which carries the covering
## as flags and keeps a transporter per edge, or `auto` (the default), which
## takes the class route wherever it applies and says which route and why at
## every row.  Each edge carries the clause its route's record can state, and
## the edge count of each row is recorded per group.
##
## The two plane rows are 189720 planes each (#390), so the incident sets are
## the same size: this is the job that reports later, never the per-test gate.
## It is the row selection of the #391 driver, so the two rows whose values
## are already decided (O(T_Co): one edge; Gamma_{Co,2}: 13 edges over 4 line
## and 7 plane cusps) can be re-run from here with
##   rows: "O,Gamma_{Co,2}"
## and the small-lattice check of the same code with
##   lattice: "6JRS"   (U + U + <-2>, where |O(A_L)| = 1, so both kernel rows
##                      are their ambient rows and the driver says so)
##
## Install (one command, from the repository root):
##   mkdir -p .github/workflows && cp results/coble-kernel-incidence-rows.yml .github/workflows/
## Then dispatch from the Actions tab (the "Coble kernel incidence rows (#381)" workflow).
##
## The job reports every row it decided and names every row that did not
## return inside its per-call cap or inside the job's budget; it is red in
## both cases.  A row that returns an edge which breaks its contract is red
## apart from that, and the line says which clause broke.
on:
  workflow_dispatch:
    inputs:
      cap:
        description: "seconds one row call may take before its row is undecided"
        required: false
        default: "10800"
        type: string
      budget:
        description: "seconds for the whole run, 0 for no budget"
        required: false
        default: "28800"
        type: string
      rows:
        description: "comma-separated rows: O, Gamma_{Co,2}, Otilde, Otilde+"
        required: false
        default: "Otilde,Otilde+"
        type: string
      lattice:
        description: "the lattice: Tco, 6JRS, U+U(2)+<-2>, 6JRX, 6JRY"
        required: false
        default: "Tco"
        type: string
      route:
        description: "the incidence route: auto, divided-class, certificate"
        required: false
        default: "auto"
        type: string
      restricted_stabilizer:
        description: "also run the restricted-stabilizer row R_{Gamma_En,2} of #286 (GitHub caps a job at six hours)"
        required: false
        default: "false"
        type: string
permissions:
  contents: read
concurrency:
  group: coble-kernel-incidence-rows
  cancel-in-progress: false
jobs:
  kernel-incidence-rows:
    name: Public incidence row ${{ matrix.row }}
    runs-on: ubuntu-latest
    container: ghcr.io/dzackgarza/sage:develop
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(inputs.rows == 'Otilde,Otilde+' && '["Otilde","Otilde+"]' || format('["{0}"]', inputs.rows || 'Otilde,Otilde+')) }}
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Mark the checkout as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run the kernel incidence rows
        env:
          PYTHONPATH: src
          COBLE_CALL_CAP: ${{ inputs.cap || '10800' }}
          COBLE_ROW_BUDGET: ${{ inputs.budget || '28800' }}
          COBLE_ROWS: ${{ matrix.row }}
          COBLE_LATTICE: ${{ inputs.lattice || 'Tco' }}
          COBLE_ROUTE: ${{ inputs.route || 'auto' }}
        run: |-
          set -o pipefail
          "$SAGE_BIN" --version
          git rev-parse HEAD
          sage_python="$("$SAGE_BIN" -c "import sys; print(sys.executable)")"
          # The two full T_Co kernel rows each retain 189720 plane lifts.
          # A matrix job gives each row its own process, memory budget and
          # full per-row cap; the driver checks the exact independent count
          # (569160, 527, 189720) for each, so both jobs must succeed.
          "$sage_python" tests/coble_gamma_co_2_incidence_rows.py \
            --rows "$COBLE_ROWS" --lattice "$COBLE_LATTICE" --route "$COBLE_ROUTE" \
            --cap "$COBLE_CALL_CAP" --budget "$COBLE_ROW_BUDGET"
        shell: bash
      # The run's own timing record (CONTRIBUTING.md ENV-03): the test run's
      # report log and JUnit file as the run's plugin copied them into
      # .timings/, and the stage records the library appended as it computed.
      - name: Keep the run's timing record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ github.job }}-${{ github.sha }}
          path: .timings/
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true

  restricted-stabilizer:
    # The construction `Gamma_{Co,2} = R_{Gamma_{En,2}}` of #286: the image in
    # `O(delta^perp)` of `Stab_{Gamma_{En,2}}(delta)`.  Its cost is the
    # indefinite port's marked-diagram decision at a non-isotropic vector, which
    # at rank 12 is minutes to hours, so it is its own job and its own input.
    # Dispatch with `restricted_stabilizer: "true"` and `cap` at or under
    # 21600 s (a GitHub-hosted job is capped at six hours).
    name: Restricted stabilizer row R_Gamma_En,2
    runs-on: ubuntu-latest
    container: ghcr.io/dzackgarza/sage:develop
    timeout-minutes: 350
    if: ${{ inputs.restricted_stabilizer == 'true' }}
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Mark the checkout as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run the restricted-stabilizer row
        env:
          COBLE_CALL_CAP: ${{ inputs.cap || '10800' }}
        run: |-
          set -o pipefail
          "$SAGE_BIN" --version
          git rev-parse HEAD
          sage_python="$("$SAGE_BIN" -c "import sys; print(sys.executable)")"
          "$sage_python" tests/coble_restricted_stabilizer.py --cap "$COBLE_CALL_CAP"
        shell: bash
