name: Research issue 388 mathematical acceptance

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact sage-extensions commit SHA to test (not a branch name)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  mathematical-acceptance:
    name: Original #388 assertions on the exact commit
    runs-on: ubuntu-latest
    container: ghcr.io/dzackgarza/sage:develop
    timeout-minutes: 120
    steps:
      - name: Checkout the exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 1
      - name: Verify Sage and source revision
        env:
          ISSUE_388_TARGET_REVISION: ${{ inputs.revision }}
        run: |
          case "$ISSUE_388_TARGET_REVISION" in
            *[!0-9a-fA-F]*|'')
              echo "revision must be a full 40-character commit SHA" >&2
              exit 1
              ;;
          esac
          if [ "${#ISSUE_388_TARGET_REVISION}" -ne 40 ]; then
            echo "revision must be a full 40-character commit SHA" >&2
            exit 1
          fi
          "$SAGE_BIN" --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$ISSUE_388_TARGET_REVISION^{commit}")"
          echo "ISSUE_388_TARGET_REVISION=$ISSUE_388_TARGET_REVISION" >> "$GITHUB_ENV"
      - name: Execute original #388 mathematical assertions
        env:
          PYTHONPATH: src
        run: |
          "$SAGE_BIN" -c 'exec(compile(open("tests/research_issue_388_acceptance.py").read(), "tests/research_issue_388_acceptance.py", "exec"), {"__name__": "__main__", "__file__": "tests/research_issue_388_acceptance.py"})'
