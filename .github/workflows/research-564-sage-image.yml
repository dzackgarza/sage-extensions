name: Research issue 564 on an exact Sage source image

on:
  workflow_dispatch:
    inputs:
      image_tag_sha:
        description: Full 40-character Sage fix-branch commit used in the immutable image tag
        required: true
        type: string
      sage_source_sha:
        description: Exact Sage PR source commit applied inside the image
        required: true
        type: string
        default: be7579575935bc25bcebb595a5a3889ad4673420

permissions:
  contents: read
  packages: read

jobs:
  spinor-generator-acceptance:
    name: Public spinor-genus assertion on pinned Sage source
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dzackgarza/sage:spinor-${{ inputs.image_tag_sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - name: Validate exact image tag and applied Sage source revision
        env:
          IMAGE_TAG_SHA: ${{ inputs.image_tag_sha }}
          SAGE_SOURCE_SHA: ${{ inputs.sage_source_sha }}
        run: |
          case "$IMAGE_TAG_SHA" in
            *[!0-9a-fA-F]*|'') echo "image_tag_sha must be a full commit SHA" >&2; exit 1 ;;
          esac
          test "${#IMAGE_TAG_SHA}" -eq 40
          test "$SAGE_BIN" = /sage/.venv/bin/sage
          test "$(cat /sage/.spinor-source-revision)" = "$SAGE_SOURCE_SHA"
          "$SAGE_BIN" --version
          printf 'Expected spinor patch revision: %s\n' "$SAGE_SOURCE_SHA"
          printf 'Sage build base revision: %s\n' "$(cat /sage/.spinor-base-revision)"

      - name: Check out public consumer assertions
        uses: actions/checkout@v4
        with:
          # Bind the consumer source to the exact workflow-dispatch revision;
          # `main` could move between dispatch and checkout.
          ref: ${{ github.sha }}

      - name: Install the checked-out sage-extensions source
        # The image uses a uv-managed Sage virtual environment. The Sage
        # launcher has no `-pip` command, so install with that environment's
        # Python interpreter rather than silently switching environments.
        run: /root/.local/bin/uv pip install --python /sage/.venv/bin/python --no-deps -e .

      - name: Install the Sage pytest collector plugin
        uses: actions/checkout@v4
        with:
          repository: dzackgarza/ai-review-ci
          # Pin the collector implementation too: a moving plugin branch
          # would make the acceptance environment non-reproducible.
          ref: adfd75d63bc2f931c3c472a68fa95a7e69aca6e7
          path: .qc-infra

      - name: Install required public pytest plugins
        run: >-
          /root/.local/bin/uv pip install --python /sage/.venv/bin/python
          pytest-timeout pytest-reportlog

      - name: Run the complete unchanged public genus acceptance file
        env:
          PYTHONPATH: ${{ github.workspace }}/.qc-infra/tool-artifacts/pytest_plugins
        # Run through Sage's launcher so it initializes the runtime environment
        # (including Maxima/ECL search paths) before importing sage.all. Calling
        # the venv's Python executable directly leaves that environment unset.
        run: >-
          "$SAGE_BIN" -c
          'import sys, pytest; sys.exit(pytest.main(["-p", "qc_sage_session", "tests/lattices/test_genus.sage"]))'
