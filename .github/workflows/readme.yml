name: README example
# The README example is the smallest acceptance: it runs on every push, under
# this repository's own pytest configuration so that the run keeps its timing
# record (CONTRIBUTING.md ENV-03), inside the shared Sage image.
on:
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read
jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/dzackgarza/sage:develop
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --user root
    env:
      SAGE_BIN: /sage/.venv/bin/sage
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the checkout into the image's Sage environment
        # The image owns every dependency except the Julia bridge. Install the
        # checkout without dependency resolution, as the consumers do, so the
        # image's dependency graph is not re-resolved.
        run: |
          sage_python="$("$SAGE_BIN" -c 'import sys; print(sys.executable)')"
          uv pip install --quiet --python "$sage_python" "sage-julia-bridge @ git+https://github.com/dzackgarza/sage-julia-bridge"
          uv pip install --quiet --python "$sage_python" --no-deps -e .
      - name: Run the README example
        run: just readme
      # The run's own timing record (CONTRIBUTING.md ENV-03): the test run's
      # report log and JUnit file as the run's plugin copied them into
      # .timings/, and the stage records the library appended as it computed.
      - name: Keep the run's timing record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ github.job }}-${{ github.sha }}
          path: .timings/
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
