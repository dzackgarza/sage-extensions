name: Isotropic reduction image tests (#387)
## The tests of tests/lattices/test_the_isotropic_reduction_image.sage in the
## published image.  The file's chamber rows take minutes per test, past the
## per-test gate's timeout, so they run in this one job that reports later.
on:
  workflow_dispatch:
    inputs:
      timeout:
        description: "seconds one test may take"
        required: false
        default: "7200"
        type: string
permissions:
  contents: read
concurrency:
  group: isotropic-reduction-image-tests
  cancel-in-progress: false
jobs:
  reduction-image-tests:
    name: The isotropic reduction image tests
    runs-on: ubuntu-latest
    container: ghcr.io/dzackgarza/sage:develop
    timeout-minutes: 350
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check out the Sage pytest collector plugin
        uses: actions/checkout@v4
        with:
          repository: dzackgarza/ai-review-ci
          ref: main
          path: .qc-infra
      - name: Mark the checkout as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run the test file through the repository's own just test
        env:
          PYTHONPATH: src
          TEST_TIMEOUT: ${{ inputs.timeout || '7200' }}
        run: |
          set -o pipefail
          "$SAGE_BIN" --version
          git rev-parse HEAD
          # The recipe reads the QC plugins and sage.just from ~/ai-review-ci.
          mkdir -p "$HOME"
          ln -sfn "$GITHUB_WORKSPACE/.qc-infra" "$HOME/ai-review-ci"
          just test tests/lattices/test_the_isotropic_reduction_image.sage \
            --no-time-gates --timeout "$TEST_TIMEOUT" -v
        shell: bash
      # The run's own timing record (CONTRIBUTING.md ENV-03): the report log and
      # JUnit file this run's plugin copied into .timings/, named by commit and
      # start time, and the library's stage records beside them.  tests/.report/
      # is not uploaded: the next run overwrites it.
      - name: Keep the run's timing record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ github.job }}-${{ github.sha }}
          path: .timings/
          retention-days: 90
          if-no-files-found: warn
